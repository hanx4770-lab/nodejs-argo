<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态走时时钟</title>
    <style>
        /* 页面居中对齐 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        /* 表盘外圈 */
        .clock {
            width: 320px;
            height: 320px;
            border: 12px solid #2c3e50;
            border-radius: 50%;
            position: relative;
            background-color: #fff;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15), inset 0 0 15px rgba(0,0,0,0.05);
        }

        /* 中心轴 */
        .clock::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #2c3e50;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* 1-12数字刻度容器 */
        .numbers-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .number {
            position: absolute;
            width: 30px;
            height: 30px;
            font-weight: bold;
            font-size: 22px;
            color: #2c3e50;
            text-align: center;
            line-height: 30px;
        }

        /* 使用 CSS 变量和三角函数自动排列 1-12 的位置 */
        .n1  { top: 25px;  right: 82px; }
        .n2  { top: 82px;  right: 25px; }
        .n3  { top: 50%;   right: 12px;  transform: translateY(-50%); }
        .n4  { bottom: 82px; right: 25px; }
        .n5  { bottom: 25px; right: 82px; }
        .n6  { bottom: 12px; left: 50%;   transform: translateX(-50%); }
        .n7  { bottom: 25px; left: 82px; }
        .n8  { bottom: 82px; left: 25px; }
        .n9  { top: 50%;   left: 12px;   transform: translateY(-50%); }
        .n10 { top: 82px;  left: 25px; }
        .n11 { top: 25px;  left: 82px; }
        .n12 { top: 12px;  left: 50%;   transform: translateX(-50%); }

        /* 指针通用样式 */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
            /* 平滑过渡动画，让秒针走动更自然（可选） */
            transition: transform 0.1s cubic-bezier(0.4, 2.08, 0.55, 0.44);
        }

        /* 时针 */
        .hour {
            width: 8px;
            height: 65px;
            background-color: #2c3e50;
            margin-left: -4px;
            z-index: 5;
        }

        /* 分针 */
        .minute {
            width: 5px;
            height: 95px;
            background-color: #7f8c8d;
            margin-left: -2.5px;
            z-index: 6;
        }

        /* 秒针 */
        .second {
            width: 2px;
            height: 115px;
            background-color: #e74c3c;
            margin-left: -1px;
            z-index: 7;
        }
    </style>
</head>
<body>

    <div class="clock">
        <!-- 完整的 1 到 12 点刻度 -->
        <div class="numbers-container">
            <div class="number n1">1</div>
            <div class="number n2">2</div>
            <div class="number n3">3</div>
            <div class="number n4">4</div>
            <div class="number n5">5</div>
            <div class="number n6">6</div>
            <div class="number n7">7</div>
            <div class="number n8">8</div>
            <div class="number n9">9</div>
            <div class="number n10">10</div>
            <div class="number n11">11</div>
            <div class="number n12">12</div>
        </div>

        <!-- 走时指针 -->
        <div class="hand hour" id="hourHand"></div>
        <div class="hand minute" id="minHand"></div>
        <div class="hand second" id="secHand"></div>
    </div>

    <script>
        const hourHand = document.getElementById('hourHand');
        const minHand = document.getElementById('minHand');
        const secHand = document.getElementById('secHand');

        function updateClock() {
            const now = new Date();
            
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            // 计算旋转角度
            // 秒针：每秒 6 度 (360度 / 60秒)
            const secDegrees = seconds * 6;
            
            // 分针：每分 6 度 + 秒针带来的微调 (6度 / 60秒 = 0.1度)
            const minDegrees = (minutes * 6) + (seconds * 0.1);
            
            // 时针：每小时 30 度 (360度 / 12小时) + 分针带来的微调 (30度 / 60分 = 0.5度)
            const hourDegrees = ((hours % 12) * 30) + (minutes * 0.5);

            // 应用旋转
            secHand.style.transform = `rotate(${secDegrees}deg)`;
            minHand.style.transform = `rotate(${minDegrees}deg)`;
            hourHand.style.transform = `rotate(${hourDegrees}deg)`;
        }

        // 初始化时钟并每秒刷新一次
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
